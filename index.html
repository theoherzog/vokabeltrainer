<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Vokabeltrainer 10.000</title>
<style>
:root {
  --bg: #F2F3F5; --card: #FFFFFF; --fg: #1F2328; --fg2: #59636E; --fg3: #8C959F; --sep: #E1E4E8;
  --blue: #0969DA; --blue-bg: #DDF4FF; --btn: #F3F4F6; --btn-b: #D8DEE4;
  --green: #3E9B4F; --red: #CF222E; --purple: #8250DF; --orange: #D4762C; --yellow: #D4A72C; --grey: #8C959F; --dark: #32383F; --cyan: #1B7C83; --pink: #BF3989;
  --glass: rgba(255,255,255,.82); --shadow: 0 6px 24px rgba(31,35,40,.12), 0 1px 2px rgba(31,35,40,.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000000; --card: #161B22; --fg: #F0F6FC; --fg2: #9198A1; --fg3: #6E7681; --sep: #30363D;
  --blue: #4493F8; --blue-bg: #0F2A47; --btn: #21262D; --btn-b: #30363D; --glass: rgba(22,27,34,.82);
  --shadow: 0 6px 24px rgba(0,0,0,.5);
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.35 var(--font); -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px calc(env(safe-area-inset-bottom, 0px) + 190px); }
[hidden] { display: none !important; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.pill { display: inline-flex; align-items: center; gap: 22px; height: 48px; padding: 0 18px; border-radius: 24px; background: var(--glass); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.round { width: 48px; justify-content: center; padding: 0; }
.avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--blue); color: #fff; display: grid; place-items: center; font: 600 15px var(--font); }
h1 { font: 700 34px/1.15 var(--font); letter-spacing: -.02em; margin: 18px 0 4px; }
.sub { color: var(--fg2); margin: 0 0 18px; font-size: 15px; }
.h2row { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 10px; }
h2 { font: 700 24px/1.2 var(--font); letter-spacing: -.01em; margin: 0; }
.h2more { color: var(--fg3); }

/* grouped list */
.group { background: var(--card); border-radius: 22px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 18px; width: 100%; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: 1px solid var(--sep); }
.row.noicon + .row.noicon::before { left: 18px; }
.ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; font: 700 13px var(--font); }
.ico svg.i { width: 19px; height: 19px; }
.row .lbl { flex: 1; min-width: 0; padding: 12px 0; }
.row .lbl small { display: block; color: var(--fg2); font-size: 14px; margin-top: 1px; }
.row .val { color: var(--fg2); text-align: right; white-space: nowrap; }
.row .val.off { color: var(--red); }
.row .chev { color: var(--fg3); width: 18px; height: 18px; }
.row:active { background: var(--btn); }
.row.static:active { background: none; }
.bar { height: 6px; border-radius: 3px; background: var(--btn-b); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }

/* flashcard */
.card { background: var(--card); border-radius: 22px; min-height: 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 20px; gap: 14px; user-select: none; -webkit-user-select: none; cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { font: 600 13px var(--font); padding: 4px 10px; border-radius: 12px; background: var(--btn); color: var(--fg2); }
.chip.lv { background: var(--blue-bg); color: var(--blue); }
.word { font: 700 38px/1.15 var(--font); letter-spacing: -.02em; word-break: break-word; }
.ans { font-size: 22px; color: var(--fg2); min-height: 30px; }
.ans.hint { font-size: 15px; color: var(--fg3); }
.empty { background: var(--card); border-radius: 22px; padding: 26px 22px; text-align: center; }
.empty p { color: var(--fg2); margin: 8px 0 18px; }
.empty b { font-size: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 25px; background: var(--btn); border: 1px solid var(--btn-b); font-weight: 600; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.block { width: 100%; }
.today { color: var(--fg2); font-size: 15px; margin: 14px 4px 0; }

/* rating bar and tab bar float above content */
.rate { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 20; display: flex; justify-content: center; padding: 0 20px; pointer-events: none; }
.rate > div { display: flex; gap: 12px; width: 100%; max-width: 600px; pointer-events: auto; }
.rate .btn { flex: 1; white-space: nowrap; padding: 0 12px; height: 56px; border-radius: 28px; font-size: 18px; box-shadow: var(--shadow); }
.rate .btn.no { background: var(--card); border-color: var(--btn-b); }
.tabs { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 30; display: flex; justify-content: center; padding: 0 20px; }
.tabs nav { display: flex; width: 100%; max-width: 600px; padding: 6px; border-radius: 38px; background: var(--glass); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 32px; color: var(--fg); text-decoration: none; font: 600 12px var(--font); position: relative; }
.tabs a[aria-current] { background: var(--btn); color: var(--blue); }
.tabs .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font: 700 11px/18px var(--font); text-align: center; }

/* chart */
.chartbox { background: var(--card); border-radius: 22px; padding: 16px 14px 10px; }
.chartbox svg { width: 100%; height: auto; display: block; }
.chartbox text { font: 12px var(--font); fill: var(--fg3); }
.chartbox line { stroke: var(--sep); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--fg2); padding: 6px 4px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; transform: translateY(105%); transition: transform .25s ease, visibility .25s; visibility: hidden; display: flex; justify-content: center; }
.sheet.on { transform: none; visibility: visible; }
.sheet > div { width: 100%; max-width: 640px; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 18px); max-height: 80vh; overflow: auto; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--btn-b); margin: 0 auto 12px; }
.sheet h3 { font: 700 20px var(--font); margin: 4px 4px 14px; }
.sheet .row .chk { color: var(--blue); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -150%); z-index: 60; background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 22px; font-size: 15px; box-shadow: var(--shadow); transition: transform .25s; max-width: 90vw; }
.toast.on { transform: translate(-50%, 0); }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>

  <symbol id="refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
  <symbol id="signal" viewBox="0 0 24 24"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></symbol>
  <symbol id="tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/></symbol>

  <symbol id="shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></symbol>
  <symbol id="undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></symbol>
  <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>

<div class="wrap">
  <div class="top">
    <div class="avatar" aria-hidden="true"><svg class="i"><use href="#book"/></svg></div>

  </div>
  <h1 id="title">Lernen</h1>

  <section id="vCard">

    </div>
  </section>

  <section id="vStats" hidden>
    <div class="group" id="sToday"></div>
    <div class="h2row"><h2>Letzte 14 Tage</h2></div>
    <div class="chartbox"><svg id="chart" viewBox="0 0 700 190" role="img" aria-label="Wörter pro Tag"></svg>
      <div class="legend"><span><i style="background:var(--green)"></i>gewusst</span><span><i style="background:var(--orange)"></i>nicht gewusst</span></div></div>
    <div class="h2row"><h2>Nach Niveau</h2></div>
    <div class="group" id="sLevels"></div>
    <div class="h2row"><h2>Pro Tag</h2></div>
    <div class="group" id="sDays"></div>
    <div class="h2row"><h2>Nach Thema</h2></div>
    <div class="group" id="sTopics"></div>
  </section>
</div>

<div class="rate" id="rateBar"><div>
  <button class="btn no" type="button" data-rate="2"><svg class="i"><use href="#x"/></svg>Kenn ich nicht</button>
  <button class="btn primary" type="button" data-rate="1"><svg class="i"><use href="#check"/></svg>Kenn ich</button>
</div></div>

  $('sDays').innerHTML = keys.map(function(k){ var x=S.d[k], p=k.split('-'), wd=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('de-DE',{weekday:'short'});
    return '<div class="row static noicon"><span class="lbl">'+wd+', '+p[2]+'.'+p[1]+'.'+p[0]+'<small>'+fmt(x.k)+' gewusst, '+fmt(x.u)+' nicht gewusst, '+fmt(x.r)+' wiederholt</small></span><span class="val">'+fmt(x.n)+'</span></div>'; }).join('')
    || '<div class="row static noicon"><span class="lbl" style="color:var(--fg2)">Sobald du Wörter bewertest, erscheint hier jeder Tag</span></div>';
  var days=[]; for (var i=13;i>=0;i--){ var dt=new Date(); dt.setDate(dt.getDate()-i); var k=dkey(dt); days.push([k,S.d[k]||{n:0,k:0,u:0}]); }
  var max=Math.max(10,Math.max.apply(null,days.map(function(x){return x[1].n;}))); var step=Math.pow(10,Math.floor(Math.log10(max))); var top=Math.ceil(max/step)*step;
  var H=150, X0=44, bw=(700-X0)/14, svg='';
  [0,.5,1].forEach(function(f){ var y=10+H-H*f; svg+='<line x1="'+X0+'" x2="700" y1="'+y+'" y2="'+y+'"/><text x="'+(X0-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(Math.round(top*f))+'</text>'; });
  days.forEach(function(x,j){ var dd=x[1], xk=X0+j*bw+bw*.18, w=bw*.64, hk=H*dd.k/top, hu=H*dd.u/top;
    if (hk) svg+='<rect x="'+xk+'" y="'+(10+H-hk)+'" width="'+w+'" height="'+hk+'" rx="3" style="fill:var(--green)"/>';
    if (hu) svg+='<rect x="'+xk+'" y="'+(10+H-hk-hu)+'" width="'+w+'" height="'+hu+'" rx="3" style="fill:var(--orange)"/>';
    var p=x[0].split('-'); if (j%2===1) svg+='<text x="'+(xk+w/2)+'" y="184" text-anchor="middle">'+(+p[2])+'.'+(+p[1])+'.</text>'; });
  $('chart').innerHTML=svg;
  var tt=''; Object.keys(TOPICS).forEach(function(t){ if(!tc[t]) return; var c=0,k=0,o=0; W.forEach(function(w,i){ if(w.t!==t) return; var s=S.s[i]; if(s){c++; if(s===1)k++;} if(s===2) o++; });
    tt+='<button class="row" type="button" data-topic="'+t+'">'+ico(TCOL[t],'<svg class="i"><use href="#tag"/></svg>')+'<span class="lbl">'+TOPICS[t]+'<small>'+fmt(c)+' von '+fmt(tc[t])+' geprüft, '+fmt(o)+' offen</small></span><span class="val">'+pct(k,c)+'</span><svg class="i chev"><use href="#chev"/></svg></button>'; });
  $('sTopics').innerHTML=tt;
}
function rate(v){
  if (cur===null || view==='statistik') return;
  var d=day(today()), prev=S.s[cur], test=isTest();
  hist.push({i:cur,prev:prev,view:view,test:test,day:today(),v:v,counted:!prev}); if (hist.length>50) hist.shift();
  if (view==='lernen'){ if (test) S.test.done[cur]=v; if (!prev){ d.n++; if(v===1) d.k++; else d.u++; S.s[cur]=v; } else if (test && v===2) S.s[cur]=2; }
  else { d.r++; if (v===1) S.s[cur]=3; else queue.push(cur); }
  if (navigator.vibrate) try { navigator.vibrate(8); } catch(e){}
  save(); queue.shift(); next();
}
function undo(){
  var h=hist.pop(); if(!h) return; var d=day(h.day);
  if (h.view==='lernen'){ if (h.counted){ d.n--; if(h.v===1) d.k--; else d.u--; } if (h.test && S.test) delete S.test.done[h.i]; } else d.r--;
  if (h.prev===undefined) delete S.s[h.i]; else S.s[h.i]=h.prev;
  save(); if (view!==h.view){ view=h.view; setHash(view); }
  buildQueue(); var p=queue.indexOf(h.i); if(p>=0) queue.splice(p,1); queue.unshift(h.i);
  cur=h.i; revealed=false; render(); window.scrollTo(0,0);
}
function reveal(){ if(cur===null) return; revealed=!revealed; render(); }
function setHash(v){ try { window.history.replaceState(null,'','#'+v); } catch(e){} }
function go(v){ view=v; setHash(v); buildQueue(); next(); window.scrollTo(0,0); }
var tt0;
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt0); tt0=setTimeout(function(){t.classList.remove('on');},2600); }

// sheets
function openSheet(title, items){
  $('shTitle').textContent=title;
  $('shList').innerHTML = items.map(function(it,n){ return '<button class="row'+(it.icon?'':' noicon')+'" type="button" data-n="'+n+'">'+(it.icon||'')+'<span class="lbl"'+(it.danger?' style="color:var(--red)"':'')+'>'+esc(it.label)+(it.small?'<small>'+esc(it.small)+'</small>':'')+'</span>'+(it.on?'<svg class="i chk"><use href="#check"/></svg>':'')+'</button>'; }).join('');
  $('shList').onclick=function(e){ var b=e.target.closest('[data-n]'); if(!b) return; var it=items[+b.dataset.n]; closeSheet(); setTimeout(function(){ it.act(); },120); };
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }
$('scrim').addEventListener('click', closeSheet);
function setCfg(k,v){ S.cfg[k]=v; save(); if (view==='statistik') view='lernen'; buildQueue(); next(); window.scrollTo(0,0); }
var SHEETS = {
  band: function(){ var it=[{label:'Einstufungstest',small:'60 Wörter, 10 je Niveau',icon:ico('dark','<svg class="i"><use href="#target"/></svg>'),on:S.cfg.band==='test',act:function(){setCfg('band','test');}}];
    LV.forEach(function(l,k){ it.push({label:l[0],small:'Rang '+fmt(l[1]+1)+' bis '+fmt(l[2]),icon:ico(l[3],l[0]),on:S.cfg.band===String(k),act:function(){setCfg('band',String(k));}}); });
    it.push({label:'Alle Wörter',small:fmt(N)+' Wörter',icon:ico('grey','<svg class="i"><use href="#book"/></svg>'),on:S.cfg.band==='all',act:function(){setCfg('band','all');}});
    openSheet('Niveau', it); },
  topic: function(){ var it=[{label:'Alle Themen',on:!S.cfg.topic,icon:ico('grey','<svg class="i"><use href="#tag"/></svg>'),act:function(){setCfg('topic','');}}];
    Object.keys(TOPICS).forEach(function(t){ if(tc[t]) it.push({label:TOPICS[t],small:fmt(tc[t])+' Wörter',icon:ico(TCOL[t],'<svg class="i"><use href="#tag"/></svg>'),on:S.cfg.topic===t,act:function(){setCfg('topic',t);}}); });
    openSheet('Thema', it); },
  dir: function(){ openSheet('Richtung', Object.keys(DIRS).map(function(k){ return {label:DIRS[k],on:S.cfg.dir===k,act:function(){setCfg('dir',k);}}; })); },
  ord: function(){ openSheet('Reihenfolge', Object.keys(ORDS).map(function(k){ return {label:ORDS[k],small:k==='f'?'Häufigste Wörter zuerst':'Zufällig innerhalb der Auswahl',on:S.cfg.ord===k,act:function(){setCfg('ord',k);}}; })); }
};
$('btnMenu').addEventListener('click', function(){ openSheet('Mehr', [
  {label:'Fortschritt kopieren',small:'Backup in die Zwischenablage, z.B. in Notizen sichern',icon:ico('blue','<svg class="i"><use href="#copy"/></svg>'),act:function(){ try { navigator.clipboard.writeText(JSON.stringify(S)).then(function(){toast('Fortschritt kopiert');},function(){toast('Kopieren nicht möglich');}); } catch(e){ toast('Kopieren nicht möglich'); } }},
  {label:'Fortschritt importieren',small:'Backup-Datei wählen',icon:ico('green','<svg class="i"><use href="#upload"/></svg>'),act:function(){ $('fileImport').click(); }},
  {label:'Fortschritt zurücksetzen',small:'Löscht alle Bewertungen auf diesem Gerät',danger:true,icon:ico('red','<svg class="i"><use href="#trash"/></svg>'),act:function(){ openSheet('Wirklich zurücksetzen?', [
     {label:'Ja, alles löschen',danger:true,act:function(){ S={s:{},d:{},cfg:Object.assign({},DEF)}; hist=[]; save(); go('lernen'); toast('Fortschritt zurückgesetzt'); }},
     {label:'Abbrechen',act:function(){}} ]); }}
]); });
$('btnTest').addEventListener('click', function(){ if (S.cfg.band==='test' && view==='lernen') { newTest(); } setCfg('band','test'); });
$('btnRetest').addEventListener('click', function(){ newTest(); buildQueue(); next(); window.scrollTo(0,0); });
$('fileImport').addEventListener('change', function(){ var f=this.files[0]; if(!f) return; f.text().then(function(t){ try{ var x=JSON.parse(t); if(!x.s) throw 0; S=x; S.cfg=Object.assign({},DEF,x.cfg||{}); save(); go('lernen'); toast('Fortschritt importiert'); }catch(e){ toast('Datei nicht erkannt'); } }); this.value=''; });
document.addEventListener('click', function(e){
  var r=e.target.closest('[data-rate]'); if(r){ rate(+r.dataset.rate); return; }
  var v=e.target.closest('[data-view]'); if(v){ e.preventDefault(); go(v.dataset.view); return; }
  var s=e.target.closest('[data-sheet]'); if(s){ SHEETS[s.dataset.sheet](); return; }
  var t=e.target.closest('[data-topic]'); if(t){ S.cfg.band = S.cfg.band==='test'?'all':S.cfg.band; setCfg('topic', t.dataset.topic); }
});
$('card').addEventListener('click', reveal);
$('btnUndo').addEventListener('click', undo);
document.addEventListener('keydown', function(e){
  if (e.key==='Escape') return closeSheet();
  if (e.key==='ArrowRight'){ rate(1); e.preventDefault(); } else if (e.key==='ArrowLeft'){ rate(2); e.preventDefault(); }
  else if (e.key===' ' || e.key==='ArrowDown' || e.key==='Enter'){ reveal(); e.preventDefault(); }
  else if (e.key==='Backspace' || (e.key==='z' && (e.metaKey||e.ctrlKey))){ undo(); e.preventDefault(); }
});
window.addEventListener('hashchange', function(){ var v=location.hash.slice(1); if(['lernen','wiederholen','statistik'].indexOf(v)>=0 && v!==view) go(v); });
var h0=(location.hash||'').slice(1); view = ['lernen','wiederholen','statistik'].indexOf(h0)>=0 ? h0 : 'lernen';
buildQueue(); next();
if ('serviceWorker' in navigator && location.protocol==='https:' && /github\.io$/.test(location.hostname)) { try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){} }
})();
</script>
</body>
